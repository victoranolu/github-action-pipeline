name: Build and Push Android APK


on:
  push:
    branches: [new-staging]

jobs:
  build_apk:
    runs-on: ubuntu-latest

    env:
      SIGNING_KEY_ALIAS: ${{ secrets.LS_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.LS_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.LS_STORE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - uses: actions/setup-node@v1
        with:
          node-version: 20.x

      - name: Find and replace Envirionment Variables
        run: |
          sed -i "s#APIM_URL#${{ secrets.NEW_APIM_URL_STAGING }}#g" ./src/api/constants.ts
          sed -i "s#NATS_URL#${{ secrets.NEW_NATS_URL_STAGING }}#g" ./src/api/constants.ts
          sed -i "s#UPLOAD_URL#${{ secrets.NEW_UPLOAD_URL_STAGING }}#g" ./src/api/constants.ts

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'android/app/LimestoneSecurity.keystore'
          encodedString: ${{ secrets.LS_KEYSTORE_BASE64 }}

      - name: Install dependencies
        run: npm install --force

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17.x'

      - name: Build APK
        run: cd android && ./gradlew assembleRelease

      - name: Create artifact folder if not exists
        run: mkdir -p new_staging_artifact

      - name: Get next APK version number
        id: version
        run: |
          count=$(ls new_staging_artifact/app-release-*.apk 2>/dev/null | wc -l)
          next=$((count + 1))
          echo "apk_version=$next" >> "$GITHUB_OUTPUT"

      - name: Copy APK to artifact folder with version number
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk new_staging_artifact/app-release-${{ steps.version.outputs.apk_version }}.apk

      - name: Commit and push APK
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add new_staging_artifact/
          git commit -m "Add APK build v${{ steps.version.outputs.apk_version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}